# Publishes a signed GrayJay plugin on every push to main that touches plugin code.
# The version is MeansTvConfig.json's, unless Pages already serves that version or newer;
# then it is bumped to published+1 and the bump is committed back to main.

name: Publish GrayJay Plugin

on:
  push:
    branches: [main]
    paths:
      - src/**
      - assets/**
      - MeansTvConfig.json
      - package.json
      - bun.lock
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14
  PAGES_BASE_URL: https://kukaraf.github.io/meanstv-grayjay-plugin

jobs:
  publish:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail

          REPO_VERSION="$(jq -r '.version' MeansTvConfig.json)"
          PUBLISHED_VERSION="$(curl -fsS "$PAGES_BASE_URL/MeansTvConfig.json" | jq -r '.version // 0' || echo 0)"
          case "$REPO_VERSION$PUBLISHED_VERSION" in *[!0-9]*) echo "Versions must be integers: repo=$REPO_VERSION published=$PUBLISHED_VERSION"; exit 1;; esac

          if [ "$REPO_VERSION" -gt "$PUBLISHED_VERSION" ]; then
            VERSION="$REPO_VERSION"
            BUMPED=false
          else
            VERSION=$((PUBLISHED_VERSION + 1))
            BUMPED=true
            jq --argjson v "$VERSION" '.version = $v' MeansTvConfig.json > /tmp/config.json
            mv /tmp/config.json MeansTvConfig.json
          fi

          echo "Releasing v$VERSION (repo=$REPO_VERSION, published=$PUBLISHED_VERSION, bumped=$BUMPED)."
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "bumped=$BUMPED" >> "$GITHUB_OUTPUT"

      - name: Build
        run: bun run build

      - name: Create release tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists."
            exit 0
          fi
          git config user.name "github-release-bot"
          git config user.email "github-release-bot@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Sign plugin artifacts
        env:
          SIGNING_KEY: ${{ secrets.MEANSTV_SIGNING_KEY || secrets.GRAYJAY_SIGNING_KEY }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "Set MEANSTV_SIGNING_KEY, or legacy GRAYJAY_SIGNING_KEY, to the RSA private key PEM."
            exit 1
          fi

          KEY_FILE="$(mktemp)"
          PUBLIC_KEY_FILE="$(mktemp)"
          SIGNATURE_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE" "$PUBLIC_KEY_FILE" "$SIGNATURE_FILE"' EXIT

          if printf '%s' "$SIGNING_KEY" | grep -q -- '-----BEGIN '; then
            printf '%b' "$SIGNING_KEY" > "$KEY_FILE"
          else
            printf '%s' "$SIGNING_KEY" | base64 -d > "$KEY_FILE"
          fi
          chmod 600 "$KEY_FILE"

          if ! openssl pkey -in "$KEY_FILE" -noout >/dev/null 2>&1; then
            echo "SIGNING_KEY must be an RSA private key PEM, a PEM with literal \\n escapes, or base64-encoded PEM."
            exit 1
          fi

          openssl pkey -in "$KEY_FILE" -pubout -outform PEM -out "$PUBLIC_KEY_FILE"
          openssl dgst -sha512 -sign "$KEY_FILE" -out "$SIGNATURE_FILE" dist/MeansTvScript.js

          SIGNATURE="$(base64 -w 0 "$SIGNATURE_FILE")"
          PUBLIC_KEY="$(tail -n +2 "$PUBLIC_KEY_FILE" | head -n -1 | tr -d '\n')"

          jq \
            --arg sig "$SIGNATURE" \
            --arg pk "$PUBLIC_KEY" \
            --arg url "$PAGES_BASE_URL" \
            --argjson version "$RELEASE_VERSION" \
            '.scriptSignature = $sig
             | .scriptPublicKey = $pk
             | .sourceUrl = ($url + "/MeansTvConfig.json")
             | .version = $version' \
            dist/MeansTvConfig.json > dist/MeansTvConfig.json.tmp
          mv dist/MeansTvConfig.json.tmp dist/MeansTvConfig.json

          openssl dgst -sha512 -verify "$PUBLIC_KEY_FILE" -signature "$SIGNATURE_FILE" dist/MeansTvScript.js

          jq '{name, version, scriptUrl, sourceUrl, iconUrl, has_signature: (.scriptSignature | length > 0), has_public_key: (.scriptPublicKey | length > 0)}' dist/MeansTvConfig.json
          test "$(jq -r '.scriptSignature | length > 0' dist/MeansTvConfig.json)" = true
          test "$(jq -r '.scriptPublicKey | length > 0' dist/MeansTvConfig.json)" = true
          test -s dist/MeansTvConfig.json
          test -s dist/MeansTvScript.js
          test -s dist/MeansTvLogo.jpg

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/MeansTvConfig.json
            dist/MeansTvScript.js
            dist/MeansTvLogo.jpg

      - name: Commit version bump back to main
        if: ${{ steps.version.outputs.bumped == 'true' }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-release-bot"
          git config user.email "github-release-bot@users.noreply.github.com"
          git add MeansTvConfig.json
          git commit -m "release: bump plugin version to $RELEASE_VERSION"
          git pull --rebase origin main
          git push origin HEAD:main
